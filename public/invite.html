<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Open your NomadRank invitation.">
  <title>NomadRank invitation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101f;
      --card: rgba(15, 27, 47, 0.94);
      --text: #f7f9fc;
      --muted: #a9b5c8;
      --accent: #6ee7b7;
      --accent-2: #38bdf8;
      --border: rgba(255, 255, 255, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(56, 189, 248, 0.22), transparent 34%),
        radial-gradient(circle at 88% 88%, rgba(110, 231, 183, 0.18), transparent 31%),
        linear-gradient(145deg, #050a13 0%, var(--bg) 55%, #0b1730 100%);
    }

    main { width: min(100%, 620px); }

    .card {
      padding: 38px 30px 30px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--accent-2), var(--accent));
      font-size: 40px;
      box-shadow: 0 16px 36px rgba(56, 189, 248, 0.25);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.04;
      letter-spacing: -.035em;
    }

    .lead {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      max-width: 500px;
    }

    .code {
      display: none;
      width: fit-content;
      max-width: 100%;
      margin: 20px auto 0;
      padding: 9px 13px;
      border: 1px solid rgba(110, 231, 183, .28);
      border-radius: 999px;
      background: rgba(110, 231, 183, .08);
      color: #d8fff0;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .05em;
      overflow-wrap: anywhere;
    }

    .status {
      margin-top: 26px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      color: var(--muted);
      line-height: 1.5;
    }

    .status.success {
      border-color: rgba(110, 231, 183, .32);
      background: rgba(110, 231, 183, .09);
      color: #d8fff0;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .button {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      background: rgba(255,255,255,.07);
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
      font: inherit;
    }

    .button.primary {
      color: #04151a;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), #a7f3d0);
    }

    .stores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .small {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .card { padding: 32px 20px 24px; }
      .stores { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="invite-title">
      <div class="logo" aria-hidden="true">🌍</div>
      <p class="eyebrow" id="invite-label">NomadRank invitation</p>
      <h1 id="invite-title">Open in NomadRank</h1>
      <p class="lead" id="invite-description">Your invitation is ready. If NomadRank is installed, this link should open it automatically.</p>
      <div class="code" id="invite-code" aria-live="polite"></div>

      <div class="status" id="handoff-status" role="status" aria-live="polite">
        Opening NomadRank…
      </div>

      <div class="actions" id="open-actions">
        <button class="button primary" id="open-app-button" type="button">Open NomadRank</button>
      </div>

      <div class="stores" id="store-actions">
        <a class="button" href="https://play.google.com/store/apps/details?id=at.persie0.nomadrank" rel="noopener noreferrer">Google Play</a>
        <a class="button" href="https://apps.apple.com/us/app/nomadrank-rate-visited-places/id6784426034" rel="noopener noreferrer">App Store</a>
      </div>

      <p class="small" id="fallback-note">If the app opened, you can close this page. If it did not, use the button above or install NomadRank first.</p>
    </section>
  </main>

  <script>
    (() => {
      const originalUrl = new URL(window.location.href);
      const path = originalUrl.pathname.toLowerCase();
      const params = originalUrl.searchParams;
      const rawCode = params.get('code') || params.get('friendCode') || params.get('friend_code') || params.get('circleCode') || params.get('circle_code') || '';
      const code = rawCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      const isFriend = path.includes('/invite/friend');
      const isCircle = path.includes('/invite/circle');
      const handoffStatus = document.getElementById('handoff-status');
      const fallbackNote = document.getElementById('fallback-note');
      const storeActions = document.getElementById('store-actions');
      const openAppButton = document.getElementById('open-app-button');
      const codeElement = document.getElementById('invite-code');
      const userAgent = navigator.userAgent || '';
      const isAndroid = /android/i.test(userAgent);
      const isIos = /iphone|ipad|ipod/i.test(userAgent);
      const loadedAt = Date.now();
      let handoffDetected = false;
      let handoffAttempted = false;

      if (isFriend) {
        document.title = 'Friend invitation · NomadRank';
        document.getElementById('invite-label').textContent = 'Friend invitation';
        document.getElementById('invite-title').textContent = 'A friend invited you';
        document.getElementById('invite-description').textContent = 'Open NomadRank to connect and accept this friend invitation.';
      } else if (isCircle) {
        document.title = 'Travel circle invitation · NomadRank';
        document.getElementById('invite-label').textContent = 'Travel circle invitation';
        document.getElementById('invite-title').textContent = 'Join the travel circle';
        document.getElementById('invite-description').textContent = 'Open NomadRank to join this shared travel circle.';
      }

      if (code) {
        codeElement.textContent = `Invite code: ${code}`;
        codeElement.style.display = 'block';
      }

      function showOpenedState() {
        handoffStatus.textContent = 'Opened in NomadRank ✓';
        handoffStatus.classList.add('success');
        fallbackNote.textContent = 'The invitation was handed to NomadRank. You can close this page.';
        storeActions.style.display = 'none';
        openAppButton.textContent = 'Open NomadRank again';
      }

      function dismissBrowserPageIfPossible() {
        try {
          window.close();
        } catch (_) {}

        if (!window.closed && window.history.length > 1) {
          // Browser security usually prevents closing a user-opened tab. Going
          // back removes the invite page from view when there is a prior page.
          setTimeout(() => {
            try {
              window.history.back();
            } catch (_) {}
          }, 120);
        }
      }

      function markHandoff() {
        if (handoffDetected) return;
        handoffDetected = true;
        try {
          sessionStorage.setItem('nomadrankInviteOpened', '1');
        } catch (_) {}
        showOpenedState();
        dismissBrowserPageIfPossible();
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          const withinExpectedHandoffWindow = Date.now() - loadedAt < 15000;
          if (handoffAttempted || withinExpectedHandoffWindow) {
            markHandoff();
          }
        } else if (handoffDetected) {
          showOpenedState();
        }
      });

      window.addEventListener('pageshow', () => {
        try {
          if (sessionStorage.getItem('nomadrankInviteOpened') === '1') {
            handoffDetected = true;
            showOpenedState();
          }
        } catch (_) {}
      });

      function androidIntentUrl() {
        const route = isCircle ? 'invite/circle' : 'invite/friend';
        const query = code ? `?code=${encodeURIComponent(code)}` : '';
        const fallback = encodeURIComponent(originalUrl.toString());
        return `intent://persie0.app/${route}${query}#Intent;scheme=https;package=at.persie0.nomadrank;S.browser_fallback_url=${fallback};end`;
      }

      openAppButton.addEventListener('click', () => {
        handoffAttempted = true;
        handoffStatus.textContent = 'Opening NomadRank…';
        handoffStatus.classList.remove('success');

        if (isAndroid) {
          window.location.href = androidIntentUrl();
          return;
        }

        // On iOS the HTTPS Universal Link is the app handoff mechanism. A
        // user-triggered navigation gives Safari/in-app browsers another chance
        // to pass the link to NomadRank.
        if (isIos) {
          window.location.href = originalUrl.toString();
          return;
        }

        fallbackNote.textContent = 'Open this invitation on your phone to continue in NomadRank.';
      });

      // If the OS already launched NomadRank while this fallback page was
      // opening, the page will be hidden almost immediately and the visibility
      // handler above turns it into a completed handoff instead of a failure UI.
      setTimeout(() => {
        if (!handoffDetected && !document.hidden) {
          handoffStatus.textContent = 'NomadRank did not open automatically.';
        }
      }, 1800);
    })();
  </script>
</body>
</html>
